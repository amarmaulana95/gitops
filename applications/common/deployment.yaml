apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: dpl
  template:
    metadata:
      labels:
        app: dpl
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: backend-go
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: dpl
              topologyKey: kubernetes.io/hostname
      containers:
        - name: app
          image: dpl
          imagePullPolicy: IfNotPresent
          ports:
            - name: app-port
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /healthz
              port: app-port
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: app-port
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 2
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: app-port
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
