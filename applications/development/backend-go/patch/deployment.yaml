apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpl
spec:
  template:
    spec:
      containers:
        - name: app
          image: localhost/backend-go:local-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: app-port
          readinessProbe:
            httpGet:
              path: /healthz
              port: app-port
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: app-port
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
